spring.application.name=backend
server.port=8081

# ===============================
# CONFIGURAÇÕES DO MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/nextstepdb?serverTimezone=UTC
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURAÇÕES DO HIBERNATE/JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# OTIMIZAÇÕES DE MEMÓRIA (Railway)
# ===============================
server.tomcat.max-threads=20
server.tomcat.min-spare-threads=5
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ===============================
# CORS
# ===============================
# Lista de origens permitidas separadas por vírgula (apenas afeta navegadores;
# apps mobile nativos não enviam Origin). Padrão "*" se não definido.
# Ex.: cors.allowed-origins=https://app.nextstep.com,https://admin.nextstep.com
# cors.allowed-origins=*

# Chaves de API e Segurança
openai.api.key=
jwt.secret=
